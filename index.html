<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Une liste de tâches simple, rapide et utilisable hors ligne.">
    <meta name="theme-color" content="#6d5dfc">
    <title>To-Do List</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="To-Do">

    <link rel="stylesheet" href="style.css">
    <script src="vendor/Sortable.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1 class="app-title">Mes tâches</h1>
            <p class="app-subtitle" id="today"></p>
        </header>

        <form class="card add-form" id="addForm" autocomplete="off">
            <label for="taskInput" class="visually-hidden">Nouvelle tâche</label>
            <input type="text" id="taskInput" class="add-input" placeholder="Ajouter une tâche…" maxlength="200" required>

            <label for="dateInput" class="date-picker" title="Choisir la date">
                <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                <span class="visually-hidden">Date de la tâche</span>
                <input type="date" id="dateInput" class="date-input">
            </label>

            <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>

        <section class="card tasks" aria-labelledby="tasksTitle">
            <div class="tasks-header">
                <h2 id="tasksTitle" class="tasks-title">Tâches</h2>
                <p class="counter" id="counter" aria-live="polite"></p>
            </div>

            <div class="filters" role="group" aria-label="Filtrer les tâches">
                <button type="button" class="filter" data-filter="all" aria-pressed="true">Toutes</button>
                <button type="button" class="filter" data-filter="active" aria-pressed="false">À faire</button>
                <button type="button" class="filter" data-filter="completed" aria-pressed="false">Terminées</button>
            </div>

            <div id="taskList" class="task-list"></div>

            <p class="empty" id="emptyState" hidden></p>

            <footer class="tasks-footer">
                <span class="hint">Double-clic pour modifier · glisser pour déplacer</span>
                <button type="button" class="btn btn-ghost" id="clearCompleted">Effacer les terminées</button>
            </footer>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <span id="toastMessage"></span>
        <button type="button" class="toast-action" id="toastUndo">Annuler</button>
    </div>

    <template id="taskTemplate">
        <li class="task-item">
            <span class="drag-handle" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></span>
            <input type="checkbox" class="task-checkbox">
            <span class="task-text"></span>
            <button type="button" class="icon-btn edit-btn">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
            </button>
            <button type="button" class="icon-btn delete-btn">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
        </li>
    </template>
</body>
</html>
